<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奇妙冒险记</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loading {
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="loading">加载中...</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script>
        // 设置游戏配置
        const config = {
            type: Phaser.AUTO,
            width: 720,
            height: 1280,
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            },
            scene: []
        };

        // 创建游戏实例
        const game = new Phaser.Game(config);

        // 全局游戏状态
        window.gameState = {
            selectedCharacter: null,
            selectedDifficulty: null,
            currentLevel: 1,
            currentChapter: 1,
            collectedParts: [],
            collectedStars: 0,
            unlockedWeapons: [],
            skillEnergy: 0,
            isSoundOn: true,
            isMusicOn: true
        };

        // 动态加载场景文件
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.body.appendChild(script);
            });
        }

        // 加载所有场景
        async function loadScenes() {
            try {
                // 加载所有场景文件
                await loadScript('src/scripts/scenes/BootScene.js');
                await loadScript('src/scripts/scenes/PreloadScene.js');
                await loadScript('src/scripts/scenes/CharacterSelectScene.js');
                await loadScript('src/scripts/scenes/DifficultySelectScene.js');
                await loadScript('src/scripts/scenes/LevelScene.js');
                await loadScript('src/scripts/scenes/PuzzleScene.js');
                await loadScript('src/scripts/scenes/ChaseScene.js');
                await loadScript('src/scripts/scenes/BattleScene.js');
                await loadScript('src/scripts/scenes/ResultScene.js');

                // 将场景添加到游戏配置
                game.scene.add('BootScene', BootScene, true);
                game.scene.add('PreloadScene', PreloadScene);
                game.scene.add('CharacterSelectScene', CharacterSelectScene);
                game.scene.add('DifficultySelectScene', DifficultySelectScene);
                game.scene.add('LevelScene', LevelScene);
                game.scene.add('PuzzleScene', PuzzleScene);
                game.scene.add('ChaseScene', ChaseScene);
                game.scene.add('BattleScene', BattleScene);
                game.scene.add('ResultScene', ResultScene);

                // 移除加载文本
                document.querySelector('.loading').textContent = '游戏加载完成！';
            } catch (error) {
                console.error('加载场景失败:', error);
                document.querySelector('.loading').textContent = '加载失败，请刷新页面';
            }
        }

        // 开始加载场景
        loadScenes();
    </script>
</body>
</html>
